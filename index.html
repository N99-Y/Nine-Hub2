<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua to Moonsec Converter</title>
    <!-- เรียกใช้ฟอนต์ Kanit เพื่อให้ตัวหนังสือภาษาไทยดูสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --input-bg: #1e1e1e;
            --input-border: #333333;
            --btn-blue: #4a8df8;
            --btn-blue-hover: #3b74d1;
            --logo-blue: #5b9bf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        /* ส่วนโลโก้ */
        .logo {
            color: var(--logo-blue);
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 6px;
            margin-top: 20px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        /* ส่วนข้อความ Label */
        label {
            display: block;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        /* ส่วนกล่องข้อความ Textarea */
        textarea {
            width: 100%;
            height: 140px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none; /* ปิดการขยายกล่อง */
            box-sizing: border-box;
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--btn-blue);
        }

        textarea::placeholder {
            color: #666;
        }

        /* ส่วนปุ่มกด */
        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-blue-hover);
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
            color: #999;
        }

        /* ปรับแต่ง Scrollbar สำหรับ Textarea */
        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- โลโก้ -->
        <div class="logo">nine</div>

        <!-- กล่องใส่โค้ด Lua -->
        <label for="lua-input">วางโค้ด Lua ของคุณที่นี่:</label>
        <textarea id="lua-input" placeholder="-- วางสคริปต์ของคุณตรงนี้..."></textarea>

        <!-- ปุ่มแปลงโค้ด (เปลี่ยนข้อความเป็น Moonsec) -->
        <button id="convert-btn" class="btn">แปลงเป็น Moonsec ทันที</button>

        <!-- กล่องแสดงผลลัพธ์ -->
        <label for="moonsec-output">ผลลัพธ์ (คัดลอกไปรันได้เลย):</label>
        <textarea id="moonsec-output" readonly placeholder="-- โค้ด Moonsec จะแสดงที่นี่"></textarea>
    </div>

    <!-- ส่วนของการทำงาน (JavaScript) -->
    <script>
        document.getElementById('convert-btn').addEventListener('click', function() {
            const luaInput = document.getElementById('lua-input').value;
            const outputBox = document.getElementById('moonsec-output');
            const btn = this;

            // เช็คว่าผู้ใช้ใส่โค้ดหรือยัง
            if (luaInput.trim() === '') {
                alert('กรุณาวางโค้ด Lua ของคุณก่อนครับ');
                return;
            }

            // ทำเอฟเฟกต์ปุ่มกำลังโหลด
            btn.innerText = 'กำลังประมวลผล...';
            btn.disabled = true;

            // จำลองการดีเลย์เหมือนกำลังส่งข้อมูลไป Server (1.5 วินาที)
            setTimeout(() => {
                
                /* 
                  หมายเหตุสำคัญ:
                  การทำ Obfuscate ด้วย Moonsec จริงๆ ไม่สามารถเขียนด้วย JavaScript หน้าเว็บเพียวๆ ได้ 
                  คุณต้องนำโค้ดส่วนนี้ไปเชื่อมต่อ (Fetch/AJAX) กับ Backend API ของคุณที่รันตัวเข้ารหัส Moonsec อีกทีครับ
                  
                  ด้านล่างนี้เป็นเพียงข้อความจำลองผลลัพธ์เท่านั้น
                */
               
                const fakeMoonsecOutput = `-- [Moonsec V3] Obfuscated Script\n-- หมายเหตุ: นี่เป็นเพียง UI จำลอง คุณต้องเชื่อมต่อ API ของ Moonsec ด้านหลังบ้าน (Backend)\n\ngetgenv().moonsec_loaded = true;\nprint("Hello, Moonsec!");`;
                
                // นำผลลัพธ์ไปแสดง
                outputBox.value = fakeMoonsecOutput;

                // คืนค่าปุ่มกลับมาเหมือนเดิม
                btn.innerText = 'แปลงเป็น Moonsec ทันที';
                btn.disabled = false;
                
                // แจ้งเตือน หรือ ทำการ Copy อัตโนมัติ (ใส่เพิ่มได้)
                // outputBox.select();
                // document.execCommand('copy');
                // alert('คัดลอกโค้ดสำเร็จ!');

            }, 1500);
        });
    </script>

</body>
</html>

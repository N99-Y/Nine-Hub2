<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N99 Script Fetcher</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
        .neon-card {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.7) 0%, rgba(15, 23, 42, 0.9) 100%);
            border: 1px solid rgba(139, 92, 246, 0.3);
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.15);
        }
        .neon-glow:focus {
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
            border-color: rgba(168, 85, 247, 0.8);
        }
        .btn-glow {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            box-shadow: 0 0 20px rgba(124, 58, 237, 0.4);
            transition: all 0.2s ease;
        }
        .btn-glow:hover {
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.7);
            transform: translateY(-1px);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-purple-500 selection:text-white">

    <header class="w-full py-6 px-4 border-b border-purple-900/40 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-3xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-3 h-3 bg-purple-500 rounded-full animate-ping"></div>
                <h1 class="text-xl font-bold bg-gradient-to-r from-purple-400 to-indigo-400 bg-clip-text text-transparent">N99 Script Fetcher</h1>
            </div>
            <span class="text-xs px-3 py-1 rounded-full bg-purple-950/80 border border-purple-700/50 text-purple-300 font-medium">Direct Fetch v3.0</span>
        </div>
    </header>

    <main class="w-full max-w-3xl mx-auto p-4 sm:p-6 flex-grow space-y-6 my-4">
        
        <div class="neon-card rounded-2xl p-5 sm:p-6 backdrop-blur-xl">
            <label for="scriptUrl" class="block text-sm font-medium text-purple-300 mb-2">วางลิงก์ GitHub / Gist (Raw หรือ Blob):</label>
            <div class="space-y-3">
                <input type="text" id="scriptUrl" placeholder="https://gist.githubusercontent.com/.../raw/..." 
                    class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-sm text-slate-200 placeholder-slate-500 focus:outline-none neon-glow transition-all">
                
                <button onclick="fetchScript()" id="fetchBtn" class="w-full py-3.5 btn-glow rounded-xl font-semibold text-white text-sm tracking-wide flex items-center justify-center space-x-2 cursor-pointer">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    <span id="btnText">ดึงโค้ดสคริปต์ (Fetch)</span>
                </button>
            </div>
        </div>

        <div id="resultSection" class="hidden space-y-4">
            
            <div class="neon-card rounded-2xl p-4 sm:p-5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-purple-400">Roblox Loadstring</span>
                    <button onclick="copyLoadstring()" class="text-xs px-3 py-1.5 bg-purple-600/30 hover:bg-purple-600/50 border border-purple-500/50 rounded-lg text-purple-200 transition flex items-center space-x-1 cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        <span id="copyLoadBtnText">คัดลอก Loadstring</span>
                    </button>
                </div>
                <div class="bg-slate-900/90 border border-slate-800 rounded-xl p-3 font-mono text-xs text-emerald-400 overflow-x-auto whitespace-nowrap" id="loadstringOutput">
                    loadstring(game:HttpGet("..."))()
                </div>
            </div>

            <div class="neon-card rounded-2xl p-4 sm:p-5">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-xs font-semibold uppercase tracking-wider text-purple-400">Raw Script Code</span>
                    <button onclick="copyRawCode()" class="text-xs px-3 py-1.5 bg-indigo-600/30 hover:bg-indigo-600/50 border border-indigo-500/50 rounded-lg text-indigo-200 transition flex items-center space-x-1 cursor-pointer">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                        <span id="copyRawBtnText">คัดลอกโค้ดทั้งหมด</span>
                    </button>
                </div>
                <pre class="bg-slate-900/90 border border-slate-800 rounded-xl p-4 font-mono text-xs text-slate-300 overflow-x-auto max-h-96" id="codeOutput"><code id="rawCodeText">กำลังโหลด...</code></pre>
            </div>

        </div>

    </main>

    <footer class="w-full text-center py-6 text-xs text-slate-500 border-t border-purple-950/40">
        N99 Script Hub • Direct GitHub/Gist Fetcher
    </footer>

    <script>
        let fetchedRawUrl = "";

        async function fetchScript() {
            let inputUrl = document.getElementById('scriptUrl').value.trim();
            if (!inputUrl) {
                alert('กรุณากรอกลิงก์ก่อนนะเพื่อน!');
                return;
            }

            let targetUrl = inputUrl;
            if (targetUrl.includes('github.com') && targetUrl.includes('/blob/')) {
                targetUrl = targetUrl.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }

            fetchedRawUrl = targetUrl;

            const btn = document.getElementById('fetchBtn');
            const btnText = document.getElementById('btnText');
            btn.disabled = true;
            btnText.innerText = "กำลังดึงข้อมูล...";

            try {
                // ดึงตรงจาก GitHub/Gist ได้เลยเพราะเปิด CORS แล้ว
                const res = await fetch(targetUrl);
                
                if (!res.ok) throw new Error("HTTP Status: " + res.status);
                
                const scriptText = await res.text();
                
                document.getElementById('resultSection').classList.remove('hidden');
                document.getElementById('rawCodeText').innerText = scriptText;
                document.getElementById('loadstringOutput').innerText = `loadstring(game:HttpGet("${targetUrl}"))()`;
                
                document.getElementById('resultSection').scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("ดึงข้อมูลไม่สำเร็จ: " + err.message + "\n(เช็กลิงก์ให้ชัวร์ว่าเป็น Raw จริงๆ นะเพื่อน)");
            } finally {
                btn.disabled = false;
                btnText.innerText = "ดึงโค้ดสคริปต์ (Fetch)";
            }
        }

        function copyRawCode() {
            const codeText = document.getElementById('rawCodeText').innerText;
            navigator.clipboard.writeText(codeText).then(() => {
                const btnText = document.getElementById('copyRawBtnText');
                btnText.innerText = "คัดลอกแล้ว! 🔥";
                setTimeout(() => { btnText.innerText = "คัดลอกโค้ดทั้งหมด"; }, 2000);
            });
        }

        function copyLoadstring() {
            const loadstringText = document.getElementById('loadstringOutput').innerText;
            navigator.clipboard.writeText(loadstringText).then(() => {
                const btnText = document.getElementById('copyLoadBtnText');
                btnText.innerText = "คัดลอกแล้ว! 🔥";
                setTimeout(() => { btnText.innerText = "คัดลอก Loadstring"; }, 2000);
            });
        }
    </script>
</body>
</html>

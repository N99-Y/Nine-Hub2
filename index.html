<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Script Hub</title>
    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #000; /* พื้นหลังดำสนิท */
            color: #fff;
        }
        /* เส้นขอบสีฟ้าไซแอนตามแบบ */
        .border-cyan { border-color: #5eead4; }
        .text-cyan { color: #5eead4; }
        
        /* แต่ง Scrollbar ให้ดูเนียนตา */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: #5eead4; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 selection:bg-teal-500 selection:text-white">
    
    <!-- กรอบหลักแบบมือถือ -->
    <div class="w-full max-w-sm border border-cyan flex flex-col relative" style="min-height: 85vh;">
        
        <!-- ส่วนหัว -->
        <div class="text-center py-5 text-4xl font-light tracking-wider">
            Nine
        </div>
        
        <hr class="border-t border-cyan w-full">
        
        <!-- ส่วนเนื้อหาหลัก -->
        <div class="flex-grow flex flex-col items-center py-8 px-6 space-y-6">
            
            <h2 class="text-2xl font-light tracking-wide">วางลิงก์เพื่อดูLua</h2>
            
            <!-- กล่องสี่เหลี่ยมสำหรับใส่ลิงก์ & โชว์โค้ด -->
            <div class="w-full aspect-square border border-cyan p-2 relative flex flex-col">
                <textarea id="ioBox" placeholder="(ใส่ลิงก์)" 
                    class="w-full h-full bg-transparent text-center text-lg text-white placeholder-gray-400 focus:outline-none resize-none"
                    oninput="handleInput()"></textarea>
            </div>
            
            <!-- ปุ่ม Action ถอดแบบจากรูปเป๊ะๆ -->
            <div class="text-xl font-light tracking-wider flex items-center space-x-2 pt-2">
                <span class="text-cyan">|</span>
                <button onclick="copyCode()" class="hover:text-cyan transition cursor-pointer">คัดลอก</button>
                <span class="text-cyan">|</span>
                <button onclick="downloadCode()" class="hover:text-cyan transition cursor-pointer">ดาวโหลด</button>
                <span class="text-cyan">|</span>
            </div>
            
        </div>
        
        <!-- ส่วนท้าย -->
        <hr class="border-t border-cyan w-full">
        <div class="text-center py-4 text-base font-light tracking-widest">
            ผู้สร้าง
        </div>
        
    </div>

    <!-- สคริปต์การทำงานหลังบ้าน -->
    <script>
        let currentCode = "";

        async function handleInput() {
            const box = document.getElementById('ioBox');
            let url = box.value.trim();
            
            // เช็คว่าถ้าพิมพ์ http เข้ามา ให้เริ่มดึงข้อมูล
            if(url.startsWith('http')) {
                // แปลงลิงก์ GitHub ธรรมดาให้เป็น Raw อัตโนมัติ
                if (url.includes('github.com') && url.includes('/blob/')) {
                    url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
                }
                
                box.value = "กำลังดึงข้อมูล...";
                
                try {
                    // ใช้ฟังก์ชันดึงตรง ไม่พึ่ง Proxy
                    const res = await fetch(url);
                    if(!res.ok) throw new Error("HTTP " + res.status);
                    
                    currentCode = await res.text();
                    
                    // เปลี่ยนกล่องให้กลายเป็นที่อ่านโค้ด
                    box.value = currentCode; 
                    box.classList.remove('text-center', 'text-lg', 'placeholder-gray-400');
                    box.classList.add('text-left', 'text-xs', 'font-mono', 'text-teal-100');
                } catch(err) {
                    box.value = "ดึงไม่สำเร็จ: " + err.message + "\n(เช็กลิงก์ให้ชัวร์นะว่าเข้าถึงได้)";
                    setTimeout(() => { box.value = url; }, 3000);
                }
            }
        }

        function copyCode() {
            if(!currentCode) return alert("วางลิงก์ก่อนดิวะ!");
            navigator.clipboard.writeText(currentCode).then(() => {
                alert("คัดลอกโค้ดเรียบร้อย!");
            });
        }

        // ฟังก์ชันโหลดเก็บเป็นไฟล์ .txt
        function downloadCode() {
            if(!currentCode) return alert("วางลิงก์ก่อนดิวะ!");
            
            // สร้างไฟล์จำลองขึ้นมาในเบราว์เซอร์
            const blob = new Blob([currentCode], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            
            // ผูกลิงก์กับตัวไฟล์จำลอง
            link.href = URL.createObjectURL(blob);
            link.download = "Nine_Script.txt"; // กำหนดชื่อไฟล์และนามสกุล .txt
            
            // สั่งกดโหลดอัตโนมัติ
            document.body.appendChild(link);
            link.click();
            
            // ลบขยะทิ้งหลังโหลดเสร็จ
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>
</body>
</html>

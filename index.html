<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Hub - Universal Extractor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>body{font-family:sans-serif;background:#030712;color:#fff}</style>
</head>
<body class="min-h-screen flex items-center justify-center p-3">
    <div class="w-full max-w-md border-2 border-teal-400 bg-gray-950 p-4 rounded-lg flex flex-col" style="height:88vh">
        
        <h1 class="text-3xl font-black text-center text-teal-400 mb-1">NINE</h1>
        <p class="text-center text-xs font-bold text-gray-300 mb-2">วางลิงก์เพื่อดู Lua<br>[ UNIVERSAL SCRIPT EXTRACTOR ]</p>
        
        <div class="flex-grow border-2 border-teal-400 flex flex-col rounded my-2 overflow-hidden">
            <!-- ช่องใส่ URL / Loadstring -->
            <div class="h-1/2 p-2 bg-gray-900 border-b border-teal-400 flex flex-col">
                <p class="text-center text-teal-400 text-[10px] font-bold mb-2">// PASTE URL HERE //</p>
                <textarea id="inputUrl" placeholder="วางลิงก์ loadstring() ที่นี่..." class="w-full flex-grow bg-black text-xs font-bold text-teal-200 p-2 resize-none outline-none text-center font-mono" oninput="fetchScript()"></textarea>
            </div>
            
            <!-- แถบสถานะ -->
            <div class="h-8 bg-teal-950 flex items-center justify-between px-4 text-xs font-bold border-b border-teal-400">
                <span id="status" class="text-rose-400">สถานะ: รอการวางลิงก์</span>
                <span id="lineCount" class="text-teal-400">0 LINES</span>
            </div>
            
            <!-- ช่องแสดงผล Lua -->
            <div class="h-1/2 p-2 bg-black flex flex-col">
                <p class="text-center text-white text-[10px] font-bold mb-2">// EXTRACTED LUA CODE //</p>
                <textarea id="outputLua" readonly class="w-full flex-grow bg-transparent text-xs font-bold text-emerald-400 resize-none outline-none font-mono" placeholder="-- โค้ด Lua จะแสดงที่นี่..."></textarea>
            </div>
        </div>

        <!-- ปุ่มควบคุม -->
        <div class="flex justify-around text-sm font-black py-2 border-t border-teal-400 mt-2">
            <button onclick="navigator.clipboard.writeText(finalCode); alert('คัดลอกโค้ดแล้ว!');" class="hover:text-teal-300">คัดลอก</button> | 
            <button onclick="downloadCode()" class="hover:text-teal-300">ดาวโหลด</button> | 
            <button onclick="clearAll()" class="text-rose-400 hover:text-rose-300">ล้าง</button>
        </div>
        <p class="text-center text-[10px] font-bold text-gray-400 mt-2">ผู้สร้าง : N99 HUB</p>
    </div>

    <script>
        let finalCode = "";

        // ฟังก์ชันลบโค้ดขยะ (Deobfuscator เบื้องต้น)
        function cleanJunkCode(code) {
            return code
                .replace(/if\s+false\s+then.*?end/gs, '') // ลบเงื่อนไขลวงที่ไม่มีวันทำงาน
                .replace(/^--.*$/gm, '')                  // ลบคอมเมนต์ที่พวกโปรแกรมเข้ารหัสชอบใส่มาหลอก
                .replace(/^\s*[\r\n]/gm, '')              // ลบบรรทัดว่างที่เยอะเกินไป
                .trim();
        }

        async function fetchScript() {
            let elInput = document.getElementById('inputUrl');
            let elOutput = document.getElementById('outputLua');
            let elStatus = document.getElementById('status');
            let elLines = document.getElementById('lineCount');
            
            let rawInput = elInput.value.trim();
            // ดึงเฉพาะลิงก์ https:// ออกมาจากก้อน loadstring อัตโนมัติ
            let extractedUrl = rawInput.match(/https?:\/\/[^\s"'`\)\>]+/i)?.[0] || rawInput; 
            
            if (!extractedUrl.startsWith('http')) return;
            
            elStatus.innerText = "สถานะ: กำลังดึงและถอดรหัส...";
            elStatus.className = "text-yellow-400";
            
            try {
                // เรียกใช้ Worker ของเรา
                let res = await fetch(`https://secret.natwarach99.workers.dev/?url=${encodeURIComponent(extractedUrl)}`);
                if (!res.ok) throw new Error("Worker ตอบกลับว่าเกิดข้อผิดพลาด (อาจติด Block หรือไม่มีไฟล์)");
                
                let rawLua = await res.text();
                
                // นำโค้ดเข้าเครื่องซักผ้า (ลบขยะ)
                finalCode = cleanJunkCode(rawLua); 
                
                // แสดงผล
                elOutput.value = finalCode; 
                elStatus.innerText = "สถานะ: สำเร็จ!";
                elStatus.className = "text-emerald-400";
                
                // นับบรรทัด
                let lines = finalCode.split('\n').length;
                elLines.innerText = lines + " LINES";

            } catch (err) {
                elStatus.innerText = "สถานะ: ล้มเหลว (Antiraw บล็อก / ลิงก์ตาย)";
                elStatus.className = "text-rose-400";
                elOutput.value = "-- " + err.message;
            }
        }

        function downloadCode() {
            if (!finalCode) return;
            let a = document.createElement('a');
            a.href = URL.createObjectURL(new Blob([finalCode], {type: "text/plain"}));
            a.download = 'N99_Extracted_Script.txt';
            a.click();
        }

        function clearAll() {
            document.getElementById('inputUrl').value = '';
            document.getElementById('outputLua').value = '';
            document.getElementById('status').innerText = 'สถานะ: รอการวางลิงก์';
            document.getElementById('status').className = 'text-gray-400';
            document.getElementById('lineCount').innerText = '0 LINES';
            finalCode = '';
        }
    </script>
</body>
</html>

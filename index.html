<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lua to Moonsec Converter</title>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #121212;
            --text-main: #e0e0e0;
            --text-muted: #a0a0a0;
            --input-bg: #1e1e1e;
            --input-border: #333333;
            --btn-blue: #4a8df8;
            --btn-blue-hover: #3b74d1;
            --logo-blue: #5b9bf8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Kanit', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 450px;
            padding: 30px 20px;
            box-sizing: border-box;
        }

        .logo {
            color: var(--logo-blue);
            text-align: center;
            font-size: 32px;
            font-weight: 600;
            text-decoration: underline;
            text-underline-offset: 6px;
            margin-top: 20px;
            margin-bottom: 40px;
            letter-spacing: 1px;
        }

        label {
            display: block;
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 140px;
            background-color: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            padding: 15px;
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
            margin-bottom: 25px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--btn-blue);
        }

        textarea::placeholder {
            color: #666;
        }

        .btn {
            width: 100%;
            padding: 16px;
            background-color: var(--btn-blue);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            margin-bottom: 25px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--btn-blue-hover);
        }

        textarea::-webkit-scrollbar {
            width: 8px;
        }
        textarea::-webkit-scrollbar-track {
            background: var(--input-bg);
            border-radius: 8px;
        }
        textarea::-webkit-scrollbar-thumb {
            background: #444;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- โลโก้ตามต้นฉบับ -->
        <div class="logo">nine</div>

        <label for="lua-input">วางโค้ด Lua ของคุณที่นี่:</label>
        <textarea id="lua-input" placeholder="-- วางสคริปต์ของคุณตรงนี้..."></textarea>

        <button id="convert-btn" class="btn">แปลงเป็น Moonsec ทันที</button>

        <label for="moonsec-output">ผลลัพธ์ (คัดลอกไปรันได้เลย):</label>
        <textarea id="moonsec-output" readonly placeholder="-- โค้ด Moonsec จะแสดงที่นี่"></textarea>
    </div>

    <script>
        document.getElementById('convert-btn').addEventListener('click', function() {
            const luaInput = document.getElementById('lua-input').value;
            const outputBox = document.getElementById('moonsec-output');

            if (luaInput.trim() === '') {
                alert('กรุณาวางโค้ด Lua ของคุณก่อนครับ');
                return;
            }

            // --- กระบวนการ Obfuscate ด้วย JavaScript (ไม่ใช้ API) ---
            
            // 1. แปลงตัวอักษรแต่ละตัวในโค้ดให้อยู่ในรูปของรหัส ASCII (Byte Array)
            let byteArray = [];
            for (let i = 0; i < luaInput.length; i++) {
                byteArray.push(luaInput.charCodeAt(i));
            }

            // 2. สร้างโครงสร้าง Lua เปลือกนอก (Loader) ให้ดูลึกลับสไตล์ Moonsec
            // โค้ดนี้จะนำรหัสตัวเลขกลับมาประกอบเป็น String แล้วรันผ่าน loadstring()
            const obfuscatedCode = 
`-- [ Moonsec Local Engine ] --
local _M = { ${byteArray.join(', ')} }
local _S = ""
for i = 1, #_M do
    _S = _S .. string.char(_M[i])
end
local _EXE = loadstring or load
_EXE(_S)()`;

            // 3. แสดงผลลัพธ์ทันที
            outputBox.value = obfuscatedCode;
        });
    </script>

</body>
</html>

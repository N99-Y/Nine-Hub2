<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Script Viewer</title>
<style>
  body { background:#0d0d10; color:#e6e6e6; font-family:ui-monospace,Menlo,Consolas,monospace; margin:0; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; color:#ff5470; }
  input,button { font:inherit; padding:10px; border-radius:8px; border:1px solid #333; }
  input { background:#1a1a1f; color:#e6e6e6; width:100%; box-sizing:border-box; }
  button { background:#ff5470; color:#fff; border:0; cursor:pointer; margin-top:8px; width:100%; }
  pre { background:#141418; border:1px solid #222; border-radius:8px; padding:12px; margin-top:14px;
        white-space:pre-wrap; word-break:break-all; max-height:70vh; overflow:auto; font-size:12px; line-height:1.5; }
  .status { font-size:12px; color:#888; margin-top:6px; min-height:16px; }
</style>
</head>
<body>
  <h1>Script Viewer</h1>
  <input id="url" placeholder="วาง URL script ที่นี่..." />
  <button id="go">ดึงโค้ด</button>
  <div class="status" id="status"></div>
  <pre id="out"></pre>

<script>
const WORKER = 'https://script-fetcher.<ชื่อมึง>.workers.dev'; // ← ใส่ URL worker ที่ deploy

const $url    = document.getElementById('url');
const $go     = document.getElementById('go');
const $status = document.getElementById('status');
const $out    = document.getElementById('out');

$go.onclick = async () => {
  const target = $url.value.trim();
  if (!target) return;
  $status.textContent = 'กำลังดึง...';
  $out.textContent = '';
  try {
    const res = await fetch(`${WORKER}/?url=${encodeURIComponent(target)}`);
    const txt = await res.text();
    if (!res.ok) throw new Error(`HTTP ${res.status}: ${txt}`);
    $out.textContent = txt;
    $status.textContent = `✅ ได้ ${txt.length.toLocaleString()} ตัวอักษร`;
  } catch (e) {
    $status.textContent = '❌ ' + e.message;
  }
};
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nine Script Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Prompt', sans-serif; 
            background-color: #030712; 
            color: #fff;
        }
        .code-font { font-family: 'JetBrains Mono', monospace; }
        .border-cyan { border-color: #2dd4bf; }
        .text-cyan { color: #2dd4bf; }
        
        @keyframes scanline {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(1000%); }
        }
        .scan-effect {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: #2dd4bf;
            box-shadow: 0 0 10px #2dd4bf;
            animation: scanline 1.5s infinite linear;
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #2dd4bf; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 selection:bg-teal-500 selection:text-white">

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 bg-gray-950 border border-cyan text-cyan text-xs px-4 py-2 rounded-full shadow-[0_0_15px_rgba(45,212,191,0.4)] opacity-0 pointer-events-none transition-all duration-300 transform -translate-y-2">
        แจ้งเตือน
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-sm border border-cyan bg-gray-950/80 backdrop-blur-md flex flex-col relative rounded-none shadow-[0_0_20px_rgba(45,212,191,0.15)]" style="min-height: 90vh;">
        
        <!-- Header -->
        <div class="text-center py-4 text-3xl font-light tracking-widest text-cyan drop-shadow-[0_0_8px_rgba(45,212,191,0.6)]">
            NINE
        </div>
        
        <hr class="border-t border-cyan w-full opacity-60">
        
        <!-- Main Content -->
        <div class="flex-grow flex flex-col items-center py-5 px-4 space-y-4">
            
            <div class="text-center">
                <h2 class="text-lg font-light tracking-wide text-gray-200">วางลิงก์เพื่อดู Lua</h2>
                <p class="text-[10px] text-cyan/70 tracking-widest mt-0.5">[ UNIVERSAL SCRIPT EXTRACTOR ]</p>
            </div>
            
            <!-- Split Box Container -->
            <div class="w-full border border-cyan bg-black/60 relative flex flex-col overflow-hidden rounded-sm" style="height: 330px;">
                
                <div id="scanner" class="scan-effect hidden"></div>

                <!-- Upper Box: Input -->
                <div class="p-2.5 bg-gray-900/40 flex-none border-b border-cyan/40">
                    <label class="text-[10px] text-cyan block mb-1 font-mono">// PASTE URL (GITHUB / GIST / ANTIRAW):</label>
                    <textarea id="urlInput" placeholder="(แปะลิงก์ GitHub, Gist หรือ Antiraw ตรงนี้...)" 
                        class="w-full h-14 bg-black/50 text-xs text-teal-200 placeholder-gray-600 focus:outline-none resize-none p-1.5 border border-cyan/20 focus:border-cyan transition code-font"
                        onfocus="playSfx('click')"
                        oninput="handleUrlInput()"></textarea>
                </div>
                
                <!-- Middle Bar: Status & Engine info -->
                <div class="bg-cyan/10 px-3 py-1 flex items-center justify-between text-[10px] font-mono text-cyan border-b border-cyan/30">
                    <span id="statusText">STATUS: WAITING</span>
                    <span id="statsInfo">0 LINES | 0B</span>
                </div>

                <!-- Lower Box: Code Output -->
                <div class="p-2 flex-grow bg-black/90 relative overflow-hidden flex flex-col">
                    <textarea id="codeDisplay" readonly placeholder="// โค้ด Lua ที่แกะสำเร็จแล้วจะโชว์ตรงนี้..." 
                        class="w-full h-full bg-transparent text-[11px] text-emerald-400 focus:outline-none resize-none code-font whitespace-pre overflow-y-auto leading-relaxed"></textarea>
                </div>

            </div>
            
            <!-- Action Buttons -->
            <div class="text-sm font-light tracking-wider flex items-center justify-center space-x-3 pt-2">
                <span class="text-cyan">|</span>
                <button onclick="copyCode()" class="hover:text-cyan transition cursor-pointer active:scale-95 py-1">คัดลอก</button>
                <span class="text-cyan">|</span>
                <button onclick="downloadCode()" class="hover:text-cyan transition cursor-pointer active:scale-95 py-1">ดาวโหลด</button>
                <span class="text-cyan">|</span>
                <button onclick="clearAll()" class="hover:text-red-400 text-gray-400 transition cursor-pointer active:scale-95 py-1">ล้าง</button>
                <span class="text-cyan">|</span>
            </div>
            
        </div>
        
        <!-- Footer -->
        <hr class="border-t border-cyan w-full opacity-60">
        <div class="text-center py-3 text-xs font-light tracking-widest text-gray-400">
            ผู้สร้าง : N99 HUB
        </div>
        
    </div>

    <!-- JavaScript Sound & Smart Multi-Fetch Logic -->
    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSfx(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, now);
                gain.gain.setValueAtTime(0.05, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.04);
                osc.start(now);
                osc.stop(now + 0.04);
            } else if (type === 'success') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(523.25, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.15);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                osc.start(now);
                osc.stop(now + 0.2);
            } else if (type === 'fetch') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.linearRampToValueAtTime(600, now + 0.08);
                gain.gain.setValueAtTime(0.03, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'error') {
                osc.type = 'square';
                osc.frequency.setValueAtTime(150, now);
                gain.gain.setValueAtTime(0.08, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                osc.start(now);
                osc.stop(now + 0.15);
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', '-translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2', 'pointer-events-none');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 2000);
        }

        let currentCode = "";

        // ฟังก์ชันล้างลิงก์ให้สะอาด
        function cleanUrl(rawUrl) {
            let url = rawUrl.trim().replace(/["')\s]+$/, '');
            
            // แก้ไขปัญหาการเข้ารหัสเปอร์เซ็นต์ซ้อน (%2520 -> %20)
            url = url.replace(/%2520/g, '%20');

            // แปลง GitHub Blob -> Raw
            if (url.includes('github.com') && url.includes('/blob/')) {
                url = url.replace('github.com', 'raw.githubusercontent.com').replace('/blob/', '/');
            }
            return url;
        }

        // ระบบดึงข้อมูลอัจฉริยะ (Smart Multi-Fetch Engine)
        async function fetchScriptSmart(targetUrl) {
            const isAntiraw = targetUrl.includes('antiraw') || targetUrl.includes('luauforge');
            
            // รายการ Proxy สำรองกรณีดึงตรงไม่ได้
            const proxies = [
                `https://secret.natwarach99.workers.dev/?url=${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            // 1. ถ้าไม่ใช่ Antiraw ให้ลองดึงตรง (Direct Fetch) ก่อน
            if (!isAntiraw) {
                try {
                    const res = await fetch(targetUrl);
                    if (res.ok) {
                        const txt = await res.text();
                        if (!txt.includes('Script is Protected') && !txt.includes('missing ?url=')) {
                            return txt;
                        }
                    }
                } catch(e) {
                    console.log("Direct fetch failed, trying proxies...");
                }
            }

            // 2. สลับไปใช้ Proxy วิ่งปลอม Header (ใช้รับมือ Antiraw และ CORS)
            for (let i = 0; i < proxies.length; i++) {
                try {
                    const res = await fetch(proxies[i]);
                    if (res.ok) {
                        const txt = await res.text();
                        // ตรวจสอบว่าไม่ได้โค้ดหน้าล็อก
                        if (txt && !txt.includes('Script is Protected') && !txt.includes('missing ?url=')) {
                            return txt;
                        }
                    }
                } catch(e) {
                    continue;
                }
            }

            throw new Error("ไม่สามารถแกะโค้ดได้ (ลิงก์อาจเสีย หรือระบบป้องกันบล็อกไว้)");
        }

        async function handleUrlInput() {
            const urlBox = document.getElementById('urlInput');
            let rawUrl = urlBox.value.trim();

            if (rawUrl.startsWith('http')) {
                playSfx('fetch');
                const targetUrl = cleanUrl(rawUrl);

                document.getElementById('scanner').classList.remove('hidden');
                document.getElementById('statusText').innerText = "STATUS: EXTRACTING...";
                document.getElementById('statusText').className = "text-amber-400 animate-pulse";

                try {
                    currentCode = await fetchScriptSmart(targetUrl);
                    document.getElementById('codeDisplay').value = currentCode;

                    // คำนวณจำนวนบรรทัดและขนาดไฟล์
                    const lines = currentCode.split('\n').length;
                    const bytes = new Blob([currentCode]).size;
                    document.getElementById('statsInfo').innerText = `${lines} LINES | ${bytes}B`;

                    document.getElementById('statusText').innerText = "STATUS: SUCCESS";
                    document.getElementById('statusText').className = "text-emerald-400";
                    
                    playSfx('success');
                    showToast("⚡ แกะสคริปต์สำเร็จแล้ว!");

                } catch (err) {
                    playSfx('error');
                    document.getElementById('statusText').innerText = "STATUS: FAILED";
                    document.getElementById('statusText').className = "text-rose-400";
                    document.getElementById('codeDisplay').value = "-- เกิดข้อผิดพลาด: " + err.message;
                    showToast("❌ แกะสคริปต์ไม่สำเร็จ!");
                } finally {
                    document.getElementById('scanner').classList.add('hidden');
                }
            }
        }

        function copyCode() {
            playSfx('click');
            if (!currentCode) {
                playSfx('error');
                return showToast("⚠️ วางลิงก์ก่อนดิวะ!");
            }
            navigator.clipboard.writeText(currentCode).then(() => {
                playSfx('success');
                showToast("📋 คัดลอกโค้ดเรียบร้อย!");
            });
        }

        function downloadCode() {
            playSfx('click');
            if (!currentCode) {
                playSfx('error');
                return showToast("⚠️ วางลิงก์ก่อนดิวะ!");
            }

            const blob = new Blob([currentCode], { type: "text/plain;charset=utf-8" });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "Nine_Script.txt";
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);

            playSfx('success');
            showToast("💾 ดาวน์โหลดไฟล์ .txt สำเร็จ!");
        }

        function clearAll() {
            playSfx('click');
            document.getElementById('urlInput').value = "";
            document.getElementById('codeDisplay').value = "";
            currentCode = "";
            document.getElementById('statusText').innerText = "STATUS: WAITING";
            document.getElementById('statusText').className = "text-cyan";
            document.getElementById('statsInfo').innerText = "0 LINES | 0B";
            showToast("🧹 ล้างข้อมูลแล้ว");
        }
    </script>
</body>
</html>
